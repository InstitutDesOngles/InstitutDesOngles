<header class="sticky top-0 z-40 backdrop-blur-xl bg-base/80 border-b border-white/60">
  <nav class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex items-center justify-between">
    <!-- Logo -->
    <a class="flex items-center gap-3" href="/">
      <img src="/images/logos/Logotype.svg" alt="Célia.B" class="h-12 w-auto" />
    </a>

    <!-- Desktop Menu -->
    <div class="hidden md:flex items-center gap-8 text-sm font-medium">
      <a class="hover:text-primary transition-colors" href="/">Accueil</a>
      <a class="hover:text-primary transition-colors" href="/instituts/">Nos Instituts</a>
      {{ with .Site.Data.celiab.social.instagram }}
      <a href="{{ . }}" target="_blank" rel="noopener noreferrer">
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
          <path
            d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z" />
        </svg>
      </a>
      {{ end }}
    </div>

    <!-- Mobile Toggle -->
    <button id="mobile-menu-toggle"
      class="md:hidden p-2.5 rounded-2xl bg-white shadow-[6px_6px_12px_rgba(211,191,198,0.35),-6px_-6px_12px_rgba(255,255,255,0.9)] text-ink hover:text-primary focus:outline-none"
      aria-expanded="false" aria-label="Ouvrir le menu">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path d="M4 6h16M4 12h16M4 18h16" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" />
      </svg>
    </button>

    <!-- CTA Desktop with Dropdown -->
    <div class="hidden md:block relative group">
      <button
        class="px-5 py-2.5 rounded-full bg-primary text-ink font-semibold shadow-soft hover:bg-primary/80 transition-colors flex items-center gap-2">
        Prendre RDV
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
        </svg>
      </button>
      <div
        class="absolute top-full right-0 pt-2 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200">
        <div class="soft-card py-2 min-w-[220px]">
          {{ range .Site.Data.celiab.instituts }}
          <a href="{{ .planity }}" class="block px-4 py-3 hover:bg-primary/20 transition-colors" target="_blank"
            rel="noopener noreferrer">
            <span class="font-semibold">{{ .nom }}</span>
            <span class="block text-xs text-ink/60">{{ .adresse }}</span>
          </a>
          {{ end }}

        </div>

      </div>
    </div>

    <!-- Mobile Menu -->
    <div id="mobile-menu"
      class="hidden md:hidden absolute top-full left-0 w-full bg-base shadow-lg p-4 flex flex-col gap-4 z-50">
      <a class="hover:text-primary transition-colors block w-full" href="/">Accueil</a>
      <a class="hover:text-primary transition-colors block w-full" href="/instituts/">Nos Instituts</a>
      <div class="border-t border-white/60 pt-4 mt-2">
        <p class="font-semibold text-ink/60 mb-2">Prendre RDV</p>
        {{ range .Site.Data.celiab.instituts }}
        <a class="block py-2 hover:text-primary transition-colors" href="{{ .planity }}" target="_blank"
          rel="noopener noreferrer">
          {{ .nom }}
        </a>
        {{ end }}
      </div>
    </div>
  </nav>
</header>
